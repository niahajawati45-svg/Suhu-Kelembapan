<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IoT Dashboard — Monitoring Kelembaban Tanah</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0a0f0d;
      --surface: #111a14;
      --border: #1e2e21;
      --text: #e2ede4;
      --muted: #6b8c70;
      --green: #4ade80;
      --green-dark: #16a34a;
      --green-glow: rgba(74, 222, 128, 0.15);
      --brown: #a16207;
      --blue: #38bdf8;
      --radius: 12px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 32px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .logo { display: flex; align-items: center; gap: 12px; }

    .logo-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, #4ade80, #16a34a);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }

    .logo-text h1 { font-size: 16px; font-weight: 600; }
    .logo-text p { font-size: 12px; color: var(--muted); }

    .status-pill {
      display: flex; align-items: center; gap: 8px;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      font-size: 13px; color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .status-dot {
      width: 8px; height: 8px; border-radius: 50%;
      background: var(--muted); transition: background 0.3s;
    }
    .status-dot.online { background: var(--green); box-shadow: 0 0 6px var(--green); }

    main { padding: 32px; max-width: 1100px; margin: 0 auto; }

    /* KARTU UTAMA */
    .cards { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-bottom: 28px; }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      position: relative; overflow: hidden;
    }

    .card::before {
      content: ''; position: absolute;
      top: 0; left: 0; right: 0; height: 3px;
    }

    .card.moisture::before { background: linear-gradient(90deg, #4ade80, #16a34a); }
    .card.status-card::before { background: linear-gradient(90deg, #a16207, #ca8a04); }

    .card-label {
      font-size: 12px; font-weight: 500;
      text-transform: uppercase; letter-spacing: 1px;
      color: var(--muted); margin-bottom: 16px;
    }

    .card-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 56px; font-weight: 500;
      line-height: 1; margin-bottom: 8px;
      transition: color 0.3s;
    }

    .card.moisture .card-value { color: var(--green); }
    .card.status-card .card-value { font-size: 28px; color: #fbbf24; margin-top: 12px; }

    .card-unit { font-size: 22px; font-weight: 300; opacity: 0.7; }
    .card-icon {
      position: absolute; right: 24px; top: 50%;
      transform: translateY(-50%);
      font-size: 48px; opacity: 0.08;
    }

    /* GAUGE */
    .gauge-wrap {
      display: flex; flex-direction: column; align-items: center;
      padding: 8px 0;
    }

    .gauge-bar-outer {
      width: 100%; height: 12px;
      background: var(--border);
      border-radius: 6px; overflow: hidden;
      margin: 12px 0 6px;
    }

    .gauge-bar-inner {
      height: 100%; border-radius: 6px;
      background: linear-gradient(90deg, #a16207, #4ade80, #38bdf8);
      transition: width 0.8s ease;
    }

    .gauge-labels {
      display: flex; justify-content: space-between;
      width: 100%; font-size: 11px; color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
    }

    /* TIMESTAMP */
    .timestamp-bar {
      display: flex; align-items: center; gap: 8px;
      font-size: 13px; color: var(--muted);
      margin-bottom: 28px;
      font-family: 'JetBrains Mono', monospace;
    }

    /* CHART */
    .chart-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
    }

    .chart-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 24px;
    }

    .chart-title { font-size: 15px; font-weight: 600; }

    .legend-item { display: flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); }
    .legend-dot { width: 10px; height: 10px; border-radius: 50%; }

    .chart-wrap { position: relative; height: 260px; }

    .no-data {
      display: flex; flex-direction: column; align-items: center;
      justify-content: center; height: 200px;
      color: var(--muted); gap: 12px;
    }
    .no-data-icon { font-size: 40px; opacity: 0.4; }
    .no-data p { font-size: 14px; }

    .waiting { animation: pulse 2s ease-in-out infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">🌱</div>
    <div class="logo-text">
      <h1>IoT Dashboard</h1>
      <p>Monitoring Kelembaban Tanah — ESP8266</p>
    </div>
  </div>
  <div class="status-pill">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Menghubungkan...</span>
  </div>
</header>

<main>
  <div class="cards">
    <!-- Kartu kelembaban -->
    <div class="card moisture">
      <div class="card-icon">💧</div>
      <div class="card-label">Kelembaban Tanah</div>
      <div class="card-value" id="soilVal">
        <span class="waiting">--</span><span class="card-unit">%</span>
      </div>
      <div class="gauge-wrap">
        <div class="gauge-bar-outer">
          <div class="gauge-bar-inner" id="gaugeBar" style="width:0%"></div>
        </div>
        <div class="gauge-labels"><span>0% Kering</span><span>100% Basah</span></div>
      </div>
    </div>

    <!-- Kartu status -->
    <div class="card status-card">
      <div class="card-icon">🌿</div>
      <div class="card-label">Status Tanah</div>
      <div class="card-value" id="soilStatus"><span class="waiting">--</span></div>
      <div style="font-size:13px; color: var(--muted); margin-top: 16px;" id="soilAdvice">Menunggu data dari sensor...</div>
    </div>
  </div>

  <div class="timestamp-bar">
    <span>🕐</span>
    <span id="timestamp">Belum ada data</span>
  </div>

  <div class="chart-section">
    <div class="chart-header">
      <div class="chart-title">Riwayat 20 Data Terakhir</div>
      <div class="legend-item">
        <div class="legend-dot" style="background: #4ade80"></div>
        Kelembaban Tanah (%)
      </div>
    </div>
    <div class="chart-wrap">
      <div class="no-data" id="noData">
        <div class="no-data-icon">📊</div>
        <p>Grafik akan muncul saat data masuk</p>
      </div>
      <canvas id="chart" style="display:none"></canvas>
    </div>
  </div>
</main>

<script>
  const socket = io();
  let chartInstance = null;

  socket.on('connect', () => {
    document.getElementById('statusDot').classList.add('online');
    document.getElementById('statusText').textContent = 'Terhubung';
  });

  socket.on('disconnect', () => {
    document.getElementById('statusDot').classList.remove('online');
    document.getElementById('statusText').textContent = 'Terputus';
  });

  socket.on('data-sensor', ({ latest, history }) => {
    if (!latest || latest.kelembaban_tanah === null) return;

    const val = latest.kelembaban_tanah;

    document.getElementById('soilVal').innerHTML = `${val}<span class="card-unit">%</span>`;
    document.getElementById('gaugeBar').style.width = `${val}%`;
    document.getElementById('soilStatus').textContent = latest.status || '--';
    document.getElementById('timestamp').textContent = `Update terakhir: ${latest.timestamp}`;

    // Saran berdasarkan status
    const advice = {
      'Sangat Kering': '⚠️ Tanah perlu segera disiram!',
      'Kering': '🪣 Sebaiknya segera disiram.',
      'Normal': '✅ Kondisi tanah baik untuk tanaman.',
      'Lembab': '💧 Tanah cukup lembab.',
      'Sangat Basah': '🌊 Tanah terlalu basah, kurangi penyiraman.'
    };
    document.getElementById('soilAdvice').textContent = advice[latest.status] || '';

    if (history.length > 0) {
      document.getElementById('noData').style.display = 'none';
      document.getElementById('chart').style.display = 'block';
      updateChart(history);
    }
  });

  function updateChart(history) {
    const labels = history.map(d => d.timestamp);
    const data = history.map(d => d.kelembaban_tanah);

    if (chartInstance) {
      chartInstance.data.labels = labels;
      chartInstance.data.datasets[0].data = data;
      chartInstance.update('active');
      return;
    }

    const ctx = document.getElementById('chart').getContext('2d');
    chartInstance = new Chart(ctx, {
      type: 'line',
      data: {
        labels,
        datasets: [{
          label: 'Kelembaban Tanah (%)',
          data,
          borderColor: '#4ade80',
          backgroundColor: 'rgba(74,222,128,0.08)',
          borderWidth: 2,
          pointRadius: 4,
          pointBackgroundColor: '#4ade80',
          tension: 0.4,
          fill: true
        }]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: { legend: { display: false } },
        scales: {
          x: {
            ticks: { color: '#6b8c70', font: { family: 'JetBrains Mono', size: 11 } },
            grid: { color: '#1e2e21' }
          },
          y: {
            min: 0, max: 100,
            ticks: { color: '#6b8c70', font: { family: 'JetBrains Mono', size: 11 } },
            grid: { color: '#1e2e21' }
          }
        }
      }
    });
  }
</script>
</body>
</html>
