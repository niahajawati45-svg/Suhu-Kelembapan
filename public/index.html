<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>IoT Dashboard — Monitoring Suhu & Kelembaban</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/socket.io/4.7.2/socket.io.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.1/chart.umd.min.js"></script>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap');

    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg: #0d1117;
      --surface: #161b22;
      --border: #21262d;
      --text: #e6edf3;
      --muted: #7d8590;
      --suhu: #ff6b35;
      --suhu-glow: rgba(255, 107, 53, 0.15);
      --lembab: #3b82f6;
      --lembab-glow: rgba(59, 130, 246, 0.15);
      --green: #3fb950;
      --radius: 12px;
    }

    body {
      font-family: 'Inter', sans-serif;
      background: var(--bg);
      color: var(--text);
      min-height: 100vh;
    }

    /* HEADER */
    header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 20px 32px;
      border-bottom: 1px solid var(--border);
      background: var(--surface);
    }

    .logo {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .logo-icon {
      width: 36px; height: 36px;
      background: linear-gradient(135deg, var(--suhu), var(--lembab));
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
      font-size: 18px;
    }

    .logo-text h1 {
      font-size: 16px;
      font-weight: 600;
      letter-spacing: -0.3px;
    }

    .logo-text p {
      font-size: 12px;
      color: var(--muted);
    }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 8px;
      padding: 6px 14px;
      border-radius: 20px;
      border: 1px solid var(--border);
      font-size: 13px;
      color: var(--muted);
      font-family: 'JetBrains Mono', monospace;
    }

    .status-dot {
      width: 8px; height: 8px;
      border-radius: 50%;
      background: var(--muted);
      transition: background 0.3s;
    }

    .status-dot.online { background: var(--green); box-shadow: 0 0 6px var(--green); }

    /* MAIN */
    main {
      padding: 32px;
      max-width: 1200px;
      margin: 0 auto;
    }

    /* KARTU SENSOR */
    .cards {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(260px, 1fr));
      gap: 20px;
      margin-bottom: 28px;
    }

    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
      position: relative;
      overflow: hidden;
      transition: border-color 0.3s;
    }

    .card::before {
      content: '';
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 3px;
    }

    .card.suhu::before { background: var(--suhu); }
    .card.lembab::before { background: var(--lembab); }

    .card-label {
      font-size: 12px;
      font-weight: 500;
      text-transform: uppercase;
      letter-spacing: 1px;
      color: var(--muted);
      margin-bottom: 16px;
    }

    .card-value {
      font-family: 'JetBrains Mono', monospace;
      font-size: 56px;
      font-weight: 500;
      line-height: 1;
      margin-bottom: 8px;
      transition: color 0.3s;
    }

    .card.suhu .card-value { color: var(--suhu); }
    .card.lembab .card-value { color: var(--lembab); }

    .card-unit {
      font-size: 22px;
      font-weight: 300;
      opacity: 0.7;
    }

    .card-sub {
      font-size: 13px;
      color: var(--muted);
      margin-top: 12px;
    }

    .card-icon {
      position: absolute;
      right: 24px;
      top: 50%;
      transform: translateY(-50%);
      font-size: 48px;
      opacity: 0.08;
    }

    /* TIMESTAMP */
    .timestamp-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 28px;
      font-family: 'JetBrains Mono', monospace;
    }

    /* CHART */
    .chart-section {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      padding: 28px;
    }

    .chart-header {
      display: flex;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 24px;
    }

    .chart-title {
      font-size: 15px;
      font-weight: 600;
    }

    .chart-legend {
      display: flex;
      gap: 20px;
    }

    .legend-item {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 12px;
      color: var(--muted);
    }

    .legend-dot {
      width: 10px; height: 10px;
      border-radius: 50%;
    }

    .chart-wrap {
      position: relative;
      height: 280px;
    }

    /* NO DATA */
    .no-data {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 200px;
      color: var(--muted);
      gap: 12px;
    }

    .no-data-icon { font-size: 40px; opacity: 0.4; }
    .no-data p { font-size: 14px; }

    /* WAITING */
    .waiting {
      animation: pulse 2s ease-in-out infinite;
    }

    @keyframes pulse {
      0%, 100% { opacity: 1; }
      50% { opacity: 0.4; }
    }
  </style>
</head>
<body>

<header>
  <div class="logo">
    <div class="logo-icon">📡</div>
    <div class="logo-text">
      <h1>IoT Dashboard</h1>
      <p>Monitoring Suhu & Kelembaban — ESP8266</p>
    </div>
  </div>
  <div class="status-pill">
    <div class="status-dot" id="statusDot"></div>
    <span id="statusText">Menghubungkan...</span>
  </div>
</header>

<main>
  <div class="cards">
    <div class="card suhu">
      <div class="card-icon">🌡️</div>
      <div class="card-label">Suhu</div>
      <div class="card-value" id="suhuVal">
        <span class="waiting">--</span><span class="card-unit">°C</span>
      </div>
      <div class="card-sub" id="suhuStatus">Menunggu data dari sensor...</div>
    </div>
    <div class="card lembab">
      <div class="card-icon">💧</div>
      <div class="card-label">Kelembaban</div>
      <div class="card-value" id="lembabVal">
        <span class="waiting">--</span><span class="card-unit">%</span>
      </div>
      <div class="card-sub" id="lembabStatus">Menunggu data dari sensor...</div>
    </div>
  </div>

  <div class="timestamp-bar">
    <span>🕐</span>
    <span id="timestamp">Belum ada data</span>
  </div>

  <div class="chart-section">
    <div class="chart-header">
      <div class="chart-title">Riwayat 20 Data Terakhir</div>
      <div class="chart-legend">
        <div class="legend-item">
          <div class="legend-dot" style="background: #ff6b35"></div>
          Suhu (°C)
        </div>
        <div class="legend-item">
          <div class="legend-dot" style="background: #3b82f6"></div>
          Kelembaban (%)
        </div>
      </div>
    </div>
    <div class="chart-wrap">
      <div class="no-data" id="noData">
        <div class="no-data-icon">📊</div>
        <p>Grafik akan muncul saat data masuk</p>
      </div>
      <canvas id="chart" style="display:none"></canvas>
    </div>
  </div>
</main>

<script>
  const socket = io();
  let chartInstance = null;

  socket.on('connect', () => {
    document.getElementById('statusDot').classList.add('online');
    document.getElementById('statusText').textContent = 'Terhubung';
  });

  socket.on('disconnect', () => {
    document.getElementById('statusDot').classList.remove('online');
    document.getElementById('statusText').textContent = 'Terputus';
  });

  socket.on('data-sensor', ({ latest, history }) => {
    if (!latest || latest.suhu === null) return;

    // Update kartu
    document.getElementById('suhuVal').innerHTML = `${latest.suhu}<span class="card-unit">°C</span>`;
    document.getElementById('lembabVal').innerHTML = `${latest.kelembaban}<span class="card-unit">%</span>`;
    document.getElementById('timestamp').textContent = `Update terakhir: ${latest.timestamp}`;

    // Status suhu
    const suhu = parseFloat(latest.suhu);
    let suhuStatus = suhu < 20 ? '🥶 Dingin' : suhu < 30 ? '✅ Normal' : suhu < 35 ? '⚠️ Hangat' : '🔥 Panas';
    document.getElementById('suhuStatus').textContent = suhuStatus;

    // Status kelembaban
    const lembab = parseFloat(latest.kelembaban);
    let lembabStatus = lembab < 30 ? '🏜️ Terlalu kering' : lembab < 60 ? '✅ Normal' : lembab < 80 ? '💦 Lembab' : '🌊 Terlalu lembab';
    document.getElementById('lembabStatus').textContent = lembabStatus;

    // Update chart
    if (history.length > 0) {
      document.getElementById('noData').style.display = 'none';
      document.getElementById('chart').style.display = 'block';
      updateChart(history);
    }
  });

  function updateChart(history) {
    const labels = history.map(d => d.timestamp);
    const suhuData = history.map(d => d.suhu);
    const lembabData = history.map(d => d.kelembaban);

    if (chartInstance) {
      chartInstance.data.labels = labels;
      chartInstance.data.datasets[0].data = suhuData;
      chartInstance.data.datasets[1].data = lembabData;
      chartInstance.update('active');
      return;
    }

    const ctx = document.getElementById('chart').getContext('2d');
    chartInstance = new Chart(ctx, {
      type: 'line',
      data: {
        labels,
        datasets: [
          {
            label: 'Suhu (°C)',
            data: suhuData,
            borderColor: '#ff6b35',
            backgroundColor: 'rgba(255,107,53,0.08)',
            borderWidth: 2,
            pointRadius: 4,
            pointBackgroundColor: '#ff6b35',
            tension: 0.4,
            fill: true
          },
          {
            label: 'Kelembaban (%)',
            data: lembabData,
            borderColor: '#3b82f6',
            backgroundColor: 'rgba(59,130,246,0.08)',
            borderWidth: 2,
            pointRadius: 4,
            pointBackgroundColor: '#3b82f6',
            tension: 0.4,
            fill: true
          }
        ]
      },
      options: {
        responsive: true,
        maintainAspectRatio: false,
        interaction: { mode: 'index', intersect: false },
        plugins: { legend: { display: false } },
        scales: {
          x: {
            ticks: { color: '#7d8590', font: { family: 'JetBrains Mono', size: 11 } },
            grid: { color: '#21262d' }
          },
          y: {
            ticks: { color: '#7d8590', font: { family: 'JetBrains Mono', size: 11 } },
            grid: { color: '#21262d' }
          }
        }
      }
    });
  }
</script>
</body>
</html>
